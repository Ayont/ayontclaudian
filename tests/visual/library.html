<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claudian visual harness — Bibliothek &amp; Chat-Navigation</title>
  <!-- Minimal Obsidian theme vars (normally injected by Obsidian), scoped to body
       like Obsidian does. The DOM below mirrors what FilePreviewPanel,
       library/libraryRow.ts and NavigationSidebar render. -->
  <style>
    * { box-sizing: border-box; }
    body {
      --mono-rgb-0: 0, 0, 0;
      --mono-rgb-100: 255, 255, 255;
      --background-primary: #1e1e22;
      --background-primary-alt: #232327;
      --background-secondary: #26262b;
      --background-secondary-alt: #2b2b31;
      --background-modifier-border: #3a3a40;
      --background-modifier-border-hover: #4a4a52;
      --background-modifier-hover: #2f2f35;
      --text-normal: #e6e6e6;
      --text-muted: #a0a0a8;
      --text-faint: #6a6a72;
      --interactive-accent: #D97757;
      --font-interface: -apple-system, system-ui, sans-serif;
      --font-text: -apple-system, system-ui, sans-serif;
      --font-monospace: ui-monospace, monospace;
      --claudian-brand: #D97757;
      --claudian-brand-rgb: 217, 119, 87;
      margin: 0;
      padding: 24px;
      background: var(--background-primary);
      color: var(--text-normal);
      font-family: var(--font-interface);
    }
    body.theme-light {
      --mono-rgb-0: 255, 255, 255;
      --mono-rgb-100: 0, 0, 0;
      --background-primary: #ffffff;
      --background-primary-alt: #f7f7f8;
      --background-secondary: #f4f4f6;
      --background-secondary-alt: #ececf0;
      --background-modifier-border: #e0e0e5;
      --background-modifier-border-hover: #cdcdd4;
      --background-modifier-hover: rgba(0, 0, 0, 0.05);
      --text-normal: #222227;
      --text-muted: #5b5b66;
      --text-faint: #8a8a94;
    }
    @media (max-width: 380px) { body { padding: 8px; } }
    .harness-section { margin-bottom: 28px; }
    .harness-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    /* The user's real case: an Obsidian sidebar ~420px wide inside a wide window. */
    .harness-chat { width: min(100%, 420px); height: 560px; border: 1px solid var(--background-modifier-border); border-radius: 12px; }
    .harness-chat--wide { width: min(100%, 560px); }
    /* Obsidian's generic control chrome, slightly more specific than the real
       `button:not(.clickable-icon)` / `input[type='text']:focus`, so the product
       selectors must neutralize it. */
    body button:not(.clickable-icon) {
      display: inline-flex; align-items: center; justify-content: center;
      height: 30px; padding: 4px 12px; border-radius: 8px;
      background-color: #3a3a42; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45); font-size: 13px;
    }
    body input[type='text'] { border: 1px solid #55555e; border-radius: 6px; padding: 4px 8px; background: #111114; }
    body input[type='text']:focus { border: 2px solid #7c3aed; box-shadow: 0 0 0 2px #7c3aed; }
    .clickable-icon { padding: 4px 6px; border-radius: 4px; color: var(--text-muted); }
    /* Composer stub: only the pieces the compact state touches. */
    .harness-composer { height: 96px; border-radius: 22px; border: 1px solid var(--background-modifier-border); background: var(--background-secondary); padding: 14px 16px; color: var(--text-muted); font-size: 13px; }
  </style>
  <link rel="stylesheet" href="../../styles.css" />
</head>
<body class="theme-dark">

  <!-- 1. The reported overlap: library open, chat scrolled up, arrows docked. -->
  <div class="harness-section" data-vis="library-arrows">
    <div class="harness-label">Bibliothek offen · Pfeile angedockt</div>
    <div class="claudian-container harness-chat">
      <div class="claudian-tab-content">
        <div class="claudian-messages-wrapper claudian-preview-open" data-chat>
          <div class="claudian-messages" data-transcript></div>
          <div class="claudian-nav-sidebar visible is-away" role="navigation" aria-label="Chat-Navigation" data-rail></div>
          <button class="claudian-nav-end-pill is-visible" type="button" aria-label="Zum Ende scrollen" aria-hidden="false" data-pill>Zum Ende</button>
          <section class="claudian-preview-panel is-open" role="region" aria-label="Dokumentbibliothek" data-panel data-query="" data-rows="default"></section>
        </div>
        <div class="claudian-input-container"><div class="harness-composer">Nachricht an Claude …</div></div>
      </div>
    </div>
  </div>

  <!-- 2. Search with highlighted matches in name and folder. -->
  <div class="harness-section" data-vis="library-search">
    <div class="harness-label">Suche mit Treffern</div>
    <div class="claudian-container harness-chat">
      <div class="claudian-tab-content">
        <div class="claudian-messages-wrapper claudian-preview-open" data-chat>
          <div class="claudian-messages" data-transcript></div>
          <section class="claudian-preview-panel is-open" role="region" aria-label="Dokumentbibliothek" data-panel data-query="certuss" data-rows="search"></section>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. Image thumbnails, a PDF peek, and graceful badge fallbacks. -->
  <div class="harness-section" data-vis="library-thumbnails">
    <div class="harness-label">Vorschaubilder</div>
    <div class="claudian-container harness-chat">
      <div class="claudian-tab-content">
        <div class="claudian-messages-wrapper claudian-preview-open" data-chat>
          <div class="claudian-messages" data-transcript></div>
          <section class="claudian-preview-panel is-open" role="region" aria-label="Dokumentbibliothek" data-panel data-query="" data-rows="thumbnails"></section>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. No results. -->
  <div class="harness-section" data-vis="library-no-results">
    <div class="harness-label">Keine Treffer</div>
    <div class="claudian-container harness-chat" style="height:420px">
      <div class="claudian-tab-content">
        <div class="claudian-messages-wrapper claudian-preview-open" data-chat>
          <div class="claudian-messages" data-transcript></div>
          <section class="claudian-preview-panel is-open" role="region" aria-label="Dokumentbibliothek" data-panel data-query="rechnung 2025" data-rows="none"></section>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. Library closed, reading history: compact rail + "Neue Ausgabe" pill. -->
  <div class="harness-section" data-vis="chat-end-pill">
    <div class="harness-label">Hochgescrollt · Zum Ende</div>
    <div class="claudian-container harness-chat harness-chat--wide">
      <div class="claudian-tab-content claudian-chat--scrolled-away">
        <div class="claudian-messages-wrapper" data-chat>
          <div class="claudian-messages" data-transcript></div>
          <div class="claudian-nav-sidebar visible is-away" role="navigation" aria-label="Chat-Navigation" data-rail></div>
          <button class="claudian-nav-end-pill is-visible has-new-output" type="button" aria-label="Neue Ausgabe – zum Ende scrollen" aria-hidden="false" data-pill>Neue Ausgabe</button>
          <button class="claudian-preview-toggle clickable-icon" type="button" aria-label="Dokumentbibliothek öffnen" aria-expanded="false" data-icon="library"></button>
        </div>
        <div class="claudian-input-container">
          <div class="claudian-mode-quick-row"><div class="claudian-mode-quick-group"><button class="claudian-mode-quick-chip clickable-icon" type="button">Zusammenfassen</button></div></div>
          <div class="harness-composer">Nachricht an Claude …</div>
        </div>
      </div>
    </div>
  </div>

<script>
  const ICONS = {
    'chevrons-up': '<path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/>',
    'chevron-up': '<path d="m18 15-6-6-6 6"/>',
    'chevron-down': '<path d="m6 9 6 6 6-6"/>',
    'chevrons-down': '<path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/>',
    library: '<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
    'external-link': '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    'more-horizontal': '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  };
  const icon = (name) => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

  // Same values as fileFormatIcons.getFormatMeta.
  const PDF_SVG = '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M3 1.5A1.5 1.5 0 0 1 4.5 0h5.879a1.5 1.5 0 0 1 1.06.44l3.122 3.12a1.5 1.5 0 0 1 .439 1.061V14.5A1.5 1.5 0 0 1 13.5 16h-9A1.5 1.5 0 0 1 3 14.5v-13zM4.5 1a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V5h-3.5A1.5 1.5 0 0 1 9 3.5V1H4.5z"/></svg>';
  const IMAGE_SVG = '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M14 2H2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zm-1 10H3a.5.5 0 0 1-.4-.8l3-4a.5.5 0 0 1 .7 0l2 2.3 2-2.8a.5.5 0 0 1 .8 0l2.5 3.5a.5.5 0 0 1-.4.8zM5 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/></svg>';
  const MD_SVG = '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h11A1.5 1.5 0 0 1 15 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5v-9zM3.5 5h1.2l1.3 1.8L7.3 5h1.2v6H7.2V7.7L6 9.4 4.8 7.7V11H3.5V5zm8 0h1v3.8l1.4-1.4.7.7-2.6 2.6-2.6-2.6.7-.7 1.4 1.4V5z"/></svg>';
  const BADGES = {
    pdf: { color: '#f87171', bg: 'rgba(239, 68, 68, 0.18)', border: 'rgba(248, 113, 113, 0.40)', html: PDF_SVG },
    image: { color: '#c084fc', bg: 'rgba(192, 132, 252, 0.16)', border: 'rgba(192, 132, 252, 0.35)', html: IMAGE_SVG },
    md: { color: '#60a5fa', bg: 'rgba(59, 130, 246, 0.16)', border: 'rgba(59, 130, 246, 0.35)', html: MD_SVG },
    xlsx: { color: '#a1a1aa', bg: 'rgba(161, 161, 170, 0.14)', border: 'rgba(161, 161, 170, 0.28)', text: 'XLSX' },
    docx: { color: '#a1a1aa', bg: 'rgba(161, 161, 170, 0.14)', border: 'rgba(161, 161, 170, 0.28)', text: 'DOCX' },
    doc: { color: '#a1a1aa', bg: 'rgba(161, 161, 170, 0.14)', border: 'rgba(161, 161, 170, 0.28)', text: 'DOC' },
  };

  const svgUri = (body) => `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">${body}</svg>`)}`;
  const THUMBS = {
    beach: svgUri('<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f2"/><stop offset="1" stop-color="#f5d9a8"/></linearGradient></defs><rect width="80" height="80" fill="url(#s)"/><circle cx="58" cy="24" r="9" fill="#fff4c2"/><rect y="50" width="80" height="12" fill="#3b8fc4"/><rect y="62" width="80" height="18" fill="#e9c98f"/>'),
    mountain: svgUri('<rect width="80" height="80" fill="#2c3e57"/><circle cx="20" cy="18" r="6" fill="#f2efe4"/><path d="M0 70 28 30l14 18 12-14 26 36Z" fill="#5d7a92"/><path d="M28 30l6 9-6-2-5 4Z" fill="#eef3f7"/>'),
    screenshot: svgUri('<rect width="80" height="80" fill="#f3f4f6"/><rect width="80" height="12" fill="#d9dce2"/><circle cx="7" cy="6" r="2" fill="#ef6a5e"/><circle cx="14" cy="6" r="2" fill="#f5be4f"/><circle cx="21" cy="6" r="2" fill="#62c655"/><rect x="8" y="20" width="40" height="5" rx="2" fill="#9aa3b2"/><rect x="8" y="31" width="64" height="4" rx="2" fill="#c7ccd5"/><rect x="8" y="40" width="56" height="4" rx="2" fill="#c7ccd5"/><rect x="8" y="52" width="28" height="16" rx="3" fill="#d97757"/>'),
    pdfPage: svgUri('<rect width="80" height="80" fill="#e7e5e0"/><rect x="14" y="6" width="52" height="70" fill="#fff"/><rect x="20" y="14" width="30" height="5" fill="#2b2b33"/><rect x="20" y="25" width="40" height="3" fill="#b9bcc4"/><rect x="20" y="32" width="36" height="3" fill="#b9bcc4"/><rect x="20" y="39" width="40" height="3" fill="#b9bcc4"/><rect x="20" y="50" width="40" height="16" fill="#d9e2ee"/>'),
  };

  const ROWS = {
    default: [
      { name: 'CERTUSS - CodeTwo Signatur.docx', folder: 'Kunden/CERTUSS/Signaturen', badge: 'docx' },
      { name: 'Angebot Firewall-Migration.pdf', folder: '.claudian/attachments', badge: 'pdf' },
      { name: 'Strategie Q3', folder: '.claudian/documents', badge: 'doc', live: true },
      { name: 'Budget 2026.xlsx', folder: 'Finanzen', badge: 'xlsx' },
      { name: 'Standup 2026-09-22.md', folder: 'Journal/2026', badge: 'md' },
      { name: 'Netzplan Standort Düsseldorf.png', folder: 'Projekte/HUNARI', badge: 'image', thumb: 'screenshot' },
      { name: 'Wartungsvertrag 3CX.pdf', folder: 'Kunden/vub', badge: 'pdf' },
      { name: 'Release-Checkliste.md', folder: 'Releases', badge: 'md' },
    ],
    search: [
      { name: [['CERTUSS', true], [' - CodeTwo Signatur.docx']], folder: [['Kunden/'], ['CERTUSS', true], ['/Signaturen']], badge: 'docx' },
      { name: [['Vertrag '], ['CERTUSS', true], [' 2026.pdf']], folder: [['Kunden/'], ['CERTUSS', true]], badge: 'pdf', thumb: 'pdfPage' },
      { name: [['Onboarding-Notizen.md']], folder: [['Kunden/'], ['Certuss', true], ['/Protokolle']], badge: 'md' },
    ],
    thumbnails: [
      { name: 'Urlaub Strand.png', folder: 'Bilder/2026', badge: 'image', thumb: 'beach' },
      { name: 'Alpen Panorama.jpg', folder: 'Bilder/2026', badge: 'image', thumb: 'mountain' },
      { name: 'Dashboard Screenshot.png', folder: '.claudian/attachments', badge: 'image', thumb: 'screenshot' },
      { name: 'Angebot Firewall-Migration.pdf', folder: '.claudian/attachments', badge: 'pdf', thumb: 'pdfPage' },
      { name: 'Scan ohne Vorschau.pdf', folder: 'Eingang', badge: 'pdf' },
      { name: 'Verschoben.png', folder: 'Bilder/alt', badge: 'image', failed: true },
      { name: 'Budget 2026.xlsx', folder: 'Finanzen', badge: 'xlsx' },
    ],
    none: [],
  };
  const TOTALS = { default: 8, search: 9, thumbnails: 7, none: 9 };

  const esc = (value) => value.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const segments = (value) => (Array.isArray(value) ? value : [[value]])
    .map(([text, mark]) => (mark ? `<mark class="claudian-preview-mark">${esc(text)}</mark>` : esc(text))).join('');
  const plain = (value) => (Array.isArray(value) ? value.map(([text]) => text).join('') : value);

  function badgeHtml(kind) {
    const meta = BADGES[kind];
    const inner = meta.html ?? `<span class="claudian-format-badge-text" style="color:${meta.color}">${meta.text}</span>`;
    return `<span class="claudian-preview-row-icon claudian-format-icon" style="color:${meta.color};background-color:${meta.bg};border-color:${meta.border}">${inner}</span>`;
  }

  function rowHtml(row) {
    const state = row.failed ? 'failed' : row.thumb ? 'loaded' : 'none';
    const thumb = row.thumb
      ? `<img class="claudian-preview-thumb" alt="" width="40" height="40" loading="lazy" decoding="async" draggable="false" src="${THUMBS[row.thumb]}">`
      : '';
    const actions = [['folder', 'In Finder anzeigen'], ['external-link', 'In Standard-App öffnen'], ['more-horizontal', 'Weitere Aktionen']]
      .map(([name, label]) => `<button class="claudian-preview-card-btn clickable-icon" type="button" aria-label="${label}">${icon(name)}</button>`).join('');
    const live = row.live ? ' claudian-preview-card--live' : '';
    return `<div class="claudian-preview-row claudian-preview-row--${row.badge}" role="listitem">`
      + `<button class="claudian-preview-card claudian-preview-row-open${live}" type="button" aria-label="${esc(plain(row.name))} öffnen">`
      + `<span class="claudian-preview-row-media" data-thumb="${state}" aria-hidden="true">${badgeHtml(row.badge)}${thumb}</span>`
      + `<span class="claudian-preview-row-text"><span class="claudian-preview-card-name claudian-preview-row-name">${segments(row.name)}</span><span class="claudian-preview-row-folder">${segments(row.folder)}</span></span></button>`
      + `<div class="claudian-preview-card-actions claudian-preview-row-actions">${actions}</div></div>`;
  }

  function panelHtml(panel) {
    const kind = panel.dataset.rows;
    const query = panel.dataset.query;
    const rows = ROWS[kind];
    const total = TOTALS[kind];
    const count = query ? `${rows.length} von ${total}` : '';
    const clear = query ? '' : ' claudian-hidden';
    const list = rows.length > 0
      ? `<div class="claudian-preview-library" role="list" aria-label="Bibliothekseinträge">${rows.map(rowHtml).join('')}</div>`
      : `<div class="claudian-preview-no-results"><p class="claudian-preview-no-results-title">Keine Treffer für „${esc(query)}“</p><p class="claudian-preview-no-results-hint">Tipp: Nach Typ suchen, etwa „pdf“, „bild“ oder „tabelle“.</p><button class="claudian-preview-no-results-reset" type="button">Suche zurücksetzen</button></div>`;
    return `<div class="claudian-preview-header"><div class="claudian-preview-brand"><span class="claudian-preview-header-icon">${icon('library')}</span><div class="claudian-preview-titles"><span class="claudian-preview-title">Bibliothek</span><span class="claudian-preview-subtitle">Dokumente &amp; Uploads</span></div></div><span class="claudian-preview-count">${total}</span><button class="claudian-preview-close clickable-icon" type="button" aria-label="Dokumentbibliothek schließen">${icon('x')}</button></div>`
      + `<div class="claudian-preview-search" role="search"><span class="claudian-preview-search-icon">${icon('search')}</span><input type="text" class="claudian-preview-search-input" aria-label="Bibliothek durchsuchen" placeholder="Name, Ordner oder Typ …" value="${esc(query)}" autocomplete="off" spellcheck="false"><span class="claudian-preview-search-count" aria-live="polite">${count}</span><button class="claudian-preview-search-clear clickable-icon${clear}" type="button" aria-label="Suche leeren">${icon('x')}</button></div>`
      + `<div class="claudian-preview-content">${list}</div>`;
  }

  const TRANSCRIPT = `
    <div class="claudian-message claudian-message-user"><div class="claudian-message-content"><div class="claudian-text-block"><p>Kannst du mir die Signatur-Vorlage für CERTUSS und das Angebot zur Firewall-Migration zusammenfassen?</p></div></div></div>
    <div class="claudian-message claudian-message-assistant"><div class="claudian-message-content"><div class="claudian-text-block"><p>Gern. Die CodeTwo-Signatur nutzt zwei Varianten: eine für interne Mails mit kurzem Footer und eine für externe Mails mit Rechtshinweisen, Logo und Kontaktblock.</p><p>Das Angebot umfasst drei Phasen: Bestandsaufnahme der FortiGate-Regeln, Migration der VPN-Profile und einen begleiteten Cutover am Wochenende. Kritisch ist die Übernahme der SD-WAN-Regeln, weil dort noch alte Objektnamen verwendet werden.</p><p>Offen sind die Lizenzlaufzeiten und das Wartungsfenster. Ich habe beide Punkte als Fragen an den Kunden notiert.</p></div></div></div>
    <div class="claudian-message claudian-message-user"><div class="claudian-message-content"><div class="claudian-text-block"><p>Erstell daraus eine Checkliste für den Cutover.</p></div></div></div>
    <div class="claudian-message claudian-message-assistant"><div class="claudian-message-content"><div class="claudian-text-block"><p>Hier ist die Checkliste, sortiert nach Zeitpunkt: Backup der Konfiguration, Export der Adressobjekte, Prüfung der Routen, Umschaltung, Funktionstest der Standorte und Abnahme mit dem Kunden.</p><p>Für jeden Schritt steht darunter, wer verantwortlich ist und woran man erkennt, dass er abgeschlossen ist.</p></div></div></div>`;

  for (const panel of document.querySelectorAll('[data-panel]')) panel.innerHTML = panelHtml(panel);
  for (const transcript of document.querySelectorAll('[data-transcript]')) transcript.innerHTML = TRANSCRIPT;
  for (const rail of document.querySelectorAll('[data-rail]')) {
    rail.innerHTML = [
      ['top', 'chevrons-up', 'Zum Anfang'],
      ['prev', 'chevron-up', 'Vorherige Nachricht'],
      ['next', 'chevron-down', 'Nächste Nachricht'],
      ['bottom', 'chevrons-down', 'Zum Ende'],
    ].map(([cls, name, label]) => `<button class="claudian-nav-btn claudian-nav-btn-${cls}" type="button" aria-label="${label}" data-tooltip-position="left">${icon(name)}</button>`).join('');
  }
  for (const pill of document.querySelectorAll('[data-pill]')) {
    const label = pill.textContent;
    pill.innerHTML = `<span class="claudian-nav-end-pill-dot" aria-hidden="true"></span><span class="claudian-nav-end-pill-icon" aria-hidden="true">${icon('chevron-down')}</span><span class="claudian-nav-end-pill-label">${label}</span>`;
  }
  for (const toggle of document.querySelectorAll('[data-icon]')) toggle.innerHTML = icon(toggle.dataset.icon);
</script>
</body>
</html>
